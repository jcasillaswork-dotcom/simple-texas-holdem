# Example nginx site for a VPS. Replace holdem.example.com and paths.
# Get HTTPS with: sudo certbot --nginx -d holdem.example.com   (service workers require HTTPS)
server {
    listen 80;
    server_name holdem.example.com;

    root /var/www/holdem/dist;
    index index.html;

    # The service worker and manifest must never be cached, or updates won't reach players.
    location = /sw.js               { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build files can be cached forever.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Only needed in server mode: forward the API to uvicorn.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /index.html; }
}
