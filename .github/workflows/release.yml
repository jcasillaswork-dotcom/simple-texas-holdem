# Builds the Windows .exe and the Linux .deb and tarballs, then publishes them as a GitHub Release.
# Trigger it by pushing a version tag that matches package.json, for example:
#   git tag v1.0.0 && git push origin v1.0.0
# Running it by hand from the Actions tab builds the files without publishing (they appear as a
# downloadable artifact on the run), which is handy for checking a build first.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in package.json ($v). Update package.json or retag."
            exit 1
          fi

      - name: Download the desktop runtime
        run: npx neu update

      - name: Build Windows and Linux packages
        run: npm run linux

      - name: Collect release files
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir upload
          cp release/holdem/holdem-win_x64.exe "upload/Holdem-$v-windows-x64.exe"
          cp release/linux/*.deb release/linux/*.tar.gz upload/
          cd upload
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" upload/* --clobber
          else
            sed "s/{{VERSION}}/$v/g" .github/release-notes.md > notes.md
            gh release create "$GITHUB_REF_NAME" upload/* --title "Hold’em $v" --notes-file notes.md --verify-tag
          fi

      - name: Keep the files from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: holdem-packages
          path: upload/
